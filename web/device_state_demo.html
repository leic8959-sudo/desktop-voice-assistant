<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小燕子 · 设备状态演示</title>
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#101722;--line:#26384c;--text:#f3f7fb;--muted:#91a0b3;--purple:#b8a4ff;--cyan:#8fdcff;--green:#79d9a7;--amber:#f6c875;--red:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 450px at 65% -15%,#603dcc44,transparent 65%),var(--bg);color:var(--text);font:14px/1.5 Inter,"Microsoft YaHei",sans-serif}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:24px 14px;background:#0b0e15;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 28px}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#d7d0ff,#876cff);color:#1c1235;font-weight:800}.brand b{display:block}.brand small{color:var(--muted)}.nav{display:grid;gap:5px}.nav button{padding:10px 12px;border:1px solid transparent;border-radius:8px;background:none;text-align:left;color:var(--muted);cursor:pointer}.nav button.active,.nav button:hover{background:#1d1a2a;border-color:#463a6b;color:var(--text)}main{padding:30px 38px;max-width:1120px}.top{display:flex;justify-content:space-between;align-items:start;margin-bottom:24px}.eyebrow{margin:0 0 5px;color:#9e8cdb;text-transform:uppercase;letter-spacing:.14em;font-size:10px}.top h1{margin:0;font-size:30px}.top p{margin:6px 0;color:var(--muted)}.layout-card{display:grid;grid-template-columns:370px 1fr;gap:22px}.device{min-height:620px;border:1px solid #344763;border-radius:32px;background:linear-gradient(145deg,#121a29,#0b111a);box-shadow:0 20px 55px #0009;padding:18px;display:flex;align-items:center;justify-content:center}.screen{width:302px;height:540px;border-radius:24px;border:5px solid #1d2a3b;background:#05080d;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;text-align:center;box-shadow:inset 0 0 35px #101d2c}.orb{width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff,#aeeaff 12%,#6571ff 35%,#261b58 68%,#090a12 72%);box-shadow:0 0 30px #8b78ff99,0 0 80px #529dff44;animation:pulse 2.8s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.25)}}.screen h2{margin:28px 0 7px;font-size:20px}.screen p{margin:0;color:var(--muted);font-size:13px}.screen .code{font-size:32px;letter-spacing:.16em;color:var(--cyan);margin-top:16px;font-weight:750}.screen .meter{display:flex;gap:5px;margin-top:22px}.meter i{width:6px;height:24px;border-radius:5px;background:#5f77ff;animation:meter 1s ease-in-out infinite}.meter i:nth-child(2){height:40px;animation-delay:.12s}.meter i:nth-child(3){height:58px;animation-delay:.24s}.meter i:nth-child(4){height:34px;animation-delay:.36s}@keyframes meter{50%{transform:scaleY(.4);opacity:.45}}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:18px}.panel h3{margin:0 0 12px}.state-list{display:grid;gap:8px;max-height:590px;overflow:auto}.state{padding:12px;border:1px solid #27384d;border-radius:9px;background:#111a26;color:var(--muted);cursor:pointer}.state:hover,.state.active{border-color:#7968c2;background:#1c1930;color:var(--text)}.state strong{display:block;color:var(--text);margin-bottom:3px}.state small{color:var(--muted)}.status-pill{display:inline-flex;margin-top:20px;padding:5px 10px;border-radius:99px;background:#1b3429;color:var(--green);font-size:12px}.footer-note{margin-top:20px;color:var(--muted);font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}main{padding:20px 14px}.layout-card{grid-template-columns:1fr}.device{min-height:560px}}
.playback{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.playback button{padding:8px 12px;border:1px solid #53437c;border-radius:8px;background:#211b35;color:#eee;cursor:pointer}.progress{width:100%;height:5px;background:#263044;border-radius:9px;margin-top:16px;overflow:hidden}.progress span{display:block;height:100%;background:var(--cyan);width:0}.screen[data-error="true"] .orb{filter:hue-rotate(120deg);box-shadow:0 0 30px #ff797955}.screen small{margin-top:12px;color:var(--amber)}.paused .orb,.paused .meter i{animation-play-state:paused}button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><span class="logo">燕</span><div><b>小燕子</b><small>设备状态演示</small></div></div><nav class="nav" id="nav"></nav><p class="footer-note">Demo · 不连接真实设备</p></aside><main><header class="top"><div><p class="eyebrow">Device Experience</p><h1>设备端状态原型</h1><p>设计演示：所有画面、倒计时和进度均为模拟，不代表固件已经实装或通过实机验收。</p></div><span class="status-pill">模拟模式</span></header><div class="playback"><button id="play">自动播放</button><button id="previous">上一个</button><button id="next">下一个</button><span id="playback-status" role="status">手动浏览</span></div><section class="layout-card"><div class="device"><div class="screen" aria-live="polite"><div class="orb"></div><h2 id="screen-title">等待配对</h2><p id="screen-desc">请在企业控制台输入配对码</p><div id="screen-code" class="code">482 913</div><small id="state-clock"></small><div id="ota-progress" class="progress"><span></span></div><div class="meter" id="meter"><i></i><i></i><i></i><i></i></div></div></div><section class="panel"><h3>全部设备状态</h3><div id="state-list" class="state-list"></div></section></section></main></div><script>
const states=[
['provisioning','首次配网','连接“助手-配置”，填写 Wi-Fi 和后台地址'],
['pairing','显示配对码','在管理后台 → 设备 → 添加设备输入下方配对码'],
['pairing_expired','配对码已过期','返回配对步骤重新申请，旧码不可继续使用'],
['claiming','领取设备凭据','后台已确认，正在通过设备会话领取专属凭据'],
['saving','保存设备身份','正在写入设备 NVS，成功后连接正式服务'],
['save_failed','保存失败','未进入正式会话，请重试或重新启动设备'],
['connecting','连接中','正在连接小燕子服务'],
['connected','已连接','设备在线，等待唤醒'],
['wake','已唤醒','你好，小燕子'],
['listening','聆听中','正在接收你的语音'],
['thinking','思考中','正在调用模型和连接器'],
['speaking','播报中','正在播放回答'],
['tool','执行工具','正在执行已确认的动作'],
['reconnecting','断线重连','服务暂时不可达，正在退避重试'],
['revoked','设备已解绑','访问凭据已撤销，请返回配对流程'],
['ota','系统升级','下载、校验并写入固件，请保持供电'],
['ota_failed','升级失败','保留当前可运行版本；校验网络后重试'],
['error','连接异常','检查网络与后台地址后重新连接'],
['recovery','恢复完成','连接已恢复，设备可以继续使用']];
const nav=document.getElementById('nav'),list=document.getElementById('state-list'),title=document.getElementById('screen-title'),desc=document.getElementById('screen-desc'),code=document.getElementById('screen-code'),meter=document.getElementById('meter'),clock=document.getElementById('state-clock'),progress=document.getElementById('ota-progress'),screen=document.querySelector('.screen'),play=document.getElementById('play');
let index=1,elapsed=0,playing=false;
function render(position){index=(position+states.length)%states.length;elapsed=0;const [id,name,description]=states[index];title.textContent=name;desc.textContent=description;code.hidden=id!=='pairing';code.style.display=id==='pairing'?'block':'none';meter.style.display=['listening','thinking','speaking','tool','connecting','claiming','saving','reconnecting','ota'].includes(id)?'flex':'none';progress.hidden=id!=='ota';screen.dataset.error=String(['pairing_expired','save_failed','revoked','ota_failed','error'].includes(id));document.querySelectorAll('[data-state]').forEach(n=>n.classList.toggle('active',Number(n.dataset.state)===index));tickVisual();}
function tickVisual(){const id=states[index][0];clock.textContent=id==='pairing'?`模拟有效期 ${String(Math.floor(Math.max(0,600-elapsed)/60)).padStart(2,'0')}:${String(Math.max(0,600-elapsed)%60).padStart(2,'0')}`:id==='ota'?`模拟进度 ${Math.min(100,elapsed*10)}%`:id==='reconnecting'?`第 ${Math.floor(elapsed/3)+1} 次连接尝试（模拟）`:'';progress.querySelector('span').style.width=`${Math.min(100,elapsed*10)}%`;}
function setPlaying(value){playing=value;play.textContent=value?'暂停播放':'自动播放';document.body.classList.toggle('paused',!value);document.getElementById('playback-status').textContent=value?'自动播放 · 每个状态 12 秒':'已暂停 · 可手动切换';}
states.forEach(([id,name,description],position)=>{for(const root of [list,nav]){const button=document.createElement('button');button.className=root===list?'state':'';button.dataset.state=position;if(root===list){const strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=name;small.textContent=description;button.append(strong,small);}else button.textContent=name;button.onclick=()=>{setPlaying(false);render(position);};root.append(button);}});
play.onclick=()=>setPlaying(!playing);document.getElementById('previous').onclick=()=>{setPlaying(false);render(index-1);};document.getElementById('next').onclick=()=>{setPlaying(false);render(index+1);};
setInterval(()=>{if(document.hidden||!playing)return;elapsed++;if(elapsed>=12)render(index+1);else tickVisual();},1000);
render(1);
</script></body></html>
