<body><main class="standalone"><header class="standalone-header"><a class="brand" href="/static/admin_console_demo.html#/overview"><span class="mark">燕</span><span>伊迪斯<small>连接器中心</small></span></a><a href="/static/admin_console_demo.html#/overview">返回控制台 →</a></header><section class="card"><p class="eyebrow">连接器</p><h1>外部服务与权限</h1><p class="muted">先配置或授权，再主动检查连接，最后允许需要的能力。页面加载不会检查远端服务；修改数据或控制设备需先预览再确认。外部工具首版支持单个 Streamable HTTP 服务。</p><div class="toolbar"><label class="sr-only" for="token">管理员令牌</label><input id="token" type="password" autocomplete="off" placeholder="管理员 device_token（不保存）"><button id="local-login" type="button">本机登录</button><button id="load" class="primary" type="button">加载 / 刷新连接器</button></div><p id="state" class="muted" role="status">可加载已有 Cookie 会话，或使用本机登录。六位配对码不能用于登录。</p><label class="search-label">搜索连接器或能力<input id="search" type="search" placeholder="输入名称、标识或权限"></label></section><section id="list" class="connector-grid" aria-live="polite"><p class="empty">尚未加载真实连接器。</p></section><noscript><p class="notice">需要启用 JavaScript 才能加载真实数据。</p></noscript></main><script type="module" src="/static/connectors.js?v=connections-20261113b"></script></body></html>
