<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>连接器 · 小燕子企业控制台</title><link rel="stylesheet" href="/static/admin_console.css?v=config-20261104"><link rel="stylesheet" href="/static/connectors.css?v=config-20261104"></head>
<body><main class="standalone"><header class="standalone-header"><a class="brand" href="/static/admin_console_demo.html#/overview"><span class="mark">燕</span><span>小燕子<small>连接器中心</small></span></a><a href="/static/admin_console_demo.html#/overview">返回控制台 →</a></header><section class="card"><p class="eyebrow">连接器</p><h1>外部服务与权限</h1><p class="muted">“已配置”仅表示服务端配置项存在，不代表 OAuth 已完成或连接测试成功。此页提供安全配置保存、Gmail 授权和手动只读连接检查；不会发送测试消息或创建内容。</p><div class="toolbar"><label class="sr-only" for="token">管理员令牌</label><input id="token" type="password" autocomplete="off" placeholder="管理员 device_token（不保存）"><button id="local-login" type="button">本机登录</button><button id="load" class="primary" type="button">加载 / 刷新连接器</button></div><p id="state" class="muted" role="status">可加载已有 Cookie 会话，或使用本机登录。六位配对码不能用于登录。</p><label class="search-label">搜索连接器或能力<input id="search" type="search" placeholder="输入名称、标识或权限"></label></section><section id="list" class="connector-grid" aria-live="polite"><p class="empty">尚未加载真实连接器。</p></section><noscript><p class="notice">需要启用 JavaScript 才能加载真实数据。</p></noscript></main><script type="module" src="/static/connectors.js?v=config-20261104"></script></body></html>
