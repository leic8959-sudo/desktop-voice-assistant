<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆 · 小燕子</title><link rel="stylesheet" href="/static/admin_console.css"><link rel="stylesheet" href="/static/desktop.css"></head>
<body><main class="standalone"><header><a href="/admin">← 控制台</a><h1>记忆管理</h1></header>
<section class="card"><div class="toolbar"><input id="memory-token" type="password" placeholder="管理员令牌（不保存）" aria-label="管理员令牌" autocomplete="off"><button id="memory-login">本机登录</button><button id="memory-refresh">加载 / 刷新</button></div><p id="memory-state" role="status">登录后查看真实保存的记忆。</p></section>
<section class="card"><h2>自动记忆</h2><p>仅提取你明确自述的稳定偏好和长期事项，不自动保存姓名、职业等个人事实；过滤凭据及敏感资料。不会自动保存模型回答、网页或邮件内容。原始对话不另存档。</p><form id="memory-settings"><label><input id="memory-enabled" type="checkbox">自动保存长期记忆</label><label>保存范围<select id="memory-mode"><option value="preferences_and_long_term">偏好与长期事项</option><option value="preferences_only">仅偏好</option><option value="review">偏好与长期事项先确认</option></select></label><label><input id="memory-model" type="checkbox">使用当前已配置文本模型提取（会产生模型请求费用）；关闭后仅识别少量明确句式</label><button type="submit">保存设置</button></form><p id="memory-extraction"></p><div id="memory-candidates"></div></section>
<section class="card"><h2>已保存的记忆</h2><form id="memory-search"><label>检索<input id="memory-query" maxlength="500" placeholder="输入项目、称呼或偏好关键词"></label><button type="submit">检索</button></form><div id="memory-items"></div><button id="memory-next" disabled>下一页</button></section>
<section class="card"><h2>手动记住 / 纠正</h2><form id="memory-write"><label>主题<input id="memory-key" maxlength="64" required></label><label>内容<textarea id="memory-value" maxlength="2048" required></textarea></label><button type="submit">保存记忆</button></form><p>手工纠正优先于自动提取。删除后会阻止同主题在保留期内被后台重新提取；你仍可主动再次保存。</p></section>
</main><script type="module" src="/static/memory.js"></script></body></html>
