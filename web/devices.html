<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备 · 小燕子企业控制台</title><link rel="stylesheet" href="/static/panel.css?v=devices-v1"><link rel="stylesheet" href="/static/connectors.css?v=devices-v1"><style>:root{color-scheme:dark;--bg:#07070a;--panel:#101014;--line:#292932;--text:#f4f7fb;--muted:#91a0b3;--blue:#b8a4ff;--green:#79d9a7;--amber:#f6c875}body{background:radial-gradient(700px 420px at 78% -12%,#603dcc33,transparent 68%),#07070a;color:var(--text)}main{max-width:1180px}.device-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.device-toolbar h1{margin:0;font-size:30px}.device-actions{display:flex;gap:8px;flex-wrap:wrap}.device-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-top:18px}.device-card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#121217,#0e0e12);padding:18px;box-shadow:0 18px 45px #0008}.device-head{display:flex;justify-content:space-between;gap:12px}.device-head h2{font-size:17px;margin:0}.device-meta{font-size:12px;color:var(--muted);margin-top:4px}.device-state{font-size:12px;color:var(--green)}.device-state.offline{color:var(--amber)}.device-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.device-kpi{padding:10px;border-radius:8px;background:#17171d}.device-kpi small{display:block;color:var(--muted);font-size:11px}.device-kpi strong{display:block;margin-top:3px}.device-card footer{display:flex;gap:8px;padding:0;border:0}.pairing-modal{position:fixed;inset:0;background:#02050acc;display:none;place-items:center;padding:20px;z-index:4}.pairing-modal.open{display:grid}.pairing{width:min(440px,100%);padding:24px;border:1px solid #4a3d73;border-radius:16px;background:#101016;box-shadow:0 25px 80px #000b}.pairing h2{margin:0 0 8px}.pair-code{font-size:40px;letter-spacing:.22em;color:var(--blue);font-weight:800;text-align:center;padding:22px 0}.pairing-actions{display:flex;justify-content:flex-end;gap:8px}@media(max-width:650px){.device-toolbar{display:block}.device-actions{margin-top:16px}}</style></head><body><header class="topbar"><div class="brand"><span class="brand-mark">燕</span><div><strong>小燕子</strong><span>企业控制台 · 设备</span></div></div><a class="admin-link" href="/static/admin_console_demo.html">返回控制台</a></header><main><section class="panel device-toolbar"><div><p class="eyebrow">设备中心</p><h1>设备管理</h1><p class="hint">已绑定设备会自动恢复显示，无需再次输入配对码。管理员登录只用于查看和管理设备；六位配对码仅用于添加新设备。</p></div><div class="device-actions"><button id="local-login" class="button primary">本机登录</button><input id="device-token" class="button" type="password" placeholder="管理员令牌（已有登录会话可免填）"><button id="pair" class="button primary">添加新设备</button><button id="refresh" class="button quiet">刷新</button></div></section><p id="device-page-state" class="hint" role="status" aria-live="polite">正在恢复已绑定设备；无需重新配对。</p><section id="devices" class="device-grid" aria-live="polite"></section></main><div id="pairing-modal" class="pairing-modal" role="dialog" aria-modal="true" aria-labelledby="pair-title"><div class="pairing"><p class="eyebrow">设备配对</p><h2 id="pair-title">输入设备屏幕上的配对码</h2><p class="hint">仅添加尚未绑定的新设备时使用。已绑定设备不需要重新取码；新设备配对码有效期为10分钟。</p><label for="pair-code-input">六位配对码</label><input id="pair-code-input" class="pair-code" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="000 000"><div class="pairing-actions"><button id="pair-cancel" class="button quiet">取消</button><button id="pair-confirm" class="button primary">确认绑定</button></div><p id="pair-state" class="hint"></p></div></div><script type="module" src="/static/devices.js?v=binding-display-20261104"></script></body></html>
